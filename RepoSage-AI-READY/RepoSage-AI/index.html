<!doctype html>
<html lang="en">
<head>
<script>
/* AI Setup add-on: lets this app get live AI answers when opened as a normal file.
   Inside Claude's viewer window.claude already exists, so this file does nothing there.
   Keys are saved only in THIS browser (localStorage) and are sent only to the provider you pick. */
(function () {
  if (window.claude && window.claude.use) return;

  var STORE = 'ai_setup_v1';
  var DEF = {
    provider: 'groq',
    groq_key: '', groq_model: 'llama-3.3-70b-versatile',
    xai_key: '', xai_model: 'grok-4',
    gemini_key: '', gemini_model: 'gemini-3.1-flash-lite',
    anthropic_key: '', anthropic_model: 'claude-sonnet-5-5', anthropic_quick: 'claude-haiku-5-5',
    ollama_url: 'http://localhost:11434', ollama_model: 'llama3.2'
  };
  var BASE = { groq: 'https://api.groq.com/openai/v1', xai: 'https://api.x.ai/v1' };
  function load() {
    var o = {}; try { o = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) {}
    var c = {}; for (var k in DEF) c[k] = (o[k] !== undefined && o[k] !== '') ? o[k] : DEF[k];
    return c;
  }
  function save(c) { try { localStorage.setItem(STORE, JSON.stringify(c)); } catch (e) {} }
  var cfg = load();

  function configured(c) {
    if (c.provider === 'groq') return !!c.groq_key.trim();
    if (c.provider === 'xai') return !!c.xai_key.trim();
    if (c.provider === 'gemini') return !!c.gemini_key.trim();
    if (c.provider === 'anthropic') return !!c.anthropic_key.trim();
    return !!c.ollama_url.trim();
  }
  function err(msg, code) { var e = new Error(msg); e.code = code || 'user'; e.message = msg; return e; }

  function fileToB64(f) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(',')[1]); };
      r.onerror = function () { rej(err('Could not read the screenshot.')); };
      r.readAsDataURL(f);
    });
  }
  async function readJSON(r) { try { return await r.json(); } catch (e) { return {}; } }

  /* ---------- providers ---------- */
  async function callAnthropic(c, prompt, o) {
    var content = [];
    var imgs = o.images || [];
    for (var i = 0; i < imgs.length; i++) content.push({ type: 'image', source: { type: 'base64', media_type: imgs[i].type || 'image/png', data: await fileToB64(imgs[i]) } });
    content.push({ type: 'text', text: prompt });
    var model = o.modelTier === 'quick' ? c.anthropic_quick : c.anthropic_model;
    var r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: o.signal,
      headers: { 'content-type': 'application/json', 'x-api-key': c.anthropic_key.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: model, max_tokens: 4096, messages: [{ role: 'user', content: content }] })
    });
    var j = await readJSON(r);
    if (!r.ok) {
      var m = (j.error && j.error.message) || ('HTTP ' + r.status);
      if (r.status === 401) throw err('Your Anthropic key was rejected. Open AI Setup and paste the key again.');
      if (r.status === 429) throw err('Anthropic says too many requests. Wait a minute and try again.', 'rate_limited');
      if (r.status === 400 && /credit/i.test(m)) throw err('Your Anthropic account has no credit. Add a few dollars at console.anthropic.com/settings/billing, or switch to a free provider in AI Setup.');
      throw err('Anthropic error: ' + m);
    }
    var text = (j.content || []).map(function (b) { return b.text || ''; }).join('');
    return { text: text, truncated: j.stop_reason === 'max_tokens' };
  }

  async function geminiPickModel(c, signal) {
    var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { signal: signal, headers: { 'x-goog-api-key': c.gemini_key.trim() } });
    var j = await readJSON(r); var list = (j.models || []).filter(function (m) {
      return /flash/.test(m.name) && !/image|tts|live|audio|robotics|computer|embedding|exp/.test(m.name) && (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0;
    }).map(function (m) { return m.name.replace('models/', ''); });
    list.sort(function (a, b) { return (/preview/.test(a) ? 1 : 0) - (/preview/.test(b) ? 1 : 0); });
    return list[0] || null;
  }
  async function callGemini(c, prompt, o, retried) {
    var parts = [];
    var imgs = o.images || [];
    for (var i = 0; i < imgs.length; i++) parts.push({ inline_data: { mime_type: imgs[i].type || 'image/png', data: await fileToB64(imgs[i]) } });
    parts.push({ text: prompt });
    var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(c.gemini_model) + ':generateContent', {
      method: 'POST', signal: o.signal,
      headers: { 'content-type': 'application/json', 'x-goog-api-key': c.gemini_key.trim() },
      body: JSON.stringify({ contents: [{ role: 'user', parts: parts }], generationConfig: { maxOutputTokens: 8192 } })
    });
    var j = await readJSON(r);
    if (!r.ok) {
      var m = (j.error && j.error.message) || ('HTTP ' + r.status);
      if (r.status === 404 && !retried) {
        var alt = await geminiPickModel(c, o.signal);
        if (alt && alt !== c.gemini_model) { c.gemini_model = alt; cfg.gemini_model = alt; save(cfg); return callGemini(c, prompt, o, true); }
      }
      if (r.status === 400 && /API key/i.test(m)) throw err('Your Gemini key looks wrong. Open AI Setup and paste it again (it starts with AIza).');
      if (r.status === 403) throw err('Google refused this key (' + m + '). Create a fresh key at aistudio.google.com/apikey and paste it in AI Setup.');
      if (r.status === 429) throw err('Free limit reached for now. Wait a minute and try again.', 'rate_limited');
      throw err('Gemini error: ' + m);
    }
    var cand = (j.candidates || [])[0] || {};
    var text = ((cand.content || {}).parts || []).map(function (p) { return p.text || ''; }).join('');
    if (!text && j.promptFeedback && j.promptFeedback.blockReason) throw err('Gemini blocked this request (' + j.promptFeedback.blockReason + ').');
    return { text: text, truncated: cand.finishReason === 'MAX_TOKENS' };
  }

  async function openaiPickModel(c, which, signal) {
    var r = await fetch(BASE[which] + '/models', { signal: signal, headers: { Authorization: 'Bearer ' + c[which + '_key'].trim() } });
    var j = await readJSON(r), ids = (j.data || []).map(function (m) { return m.id; });
    var pref = which === 'groq'
      ? ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', 'openai/gpt-oss-120b', 'openai/gpt-oss-20b']
      : [];
    for (var i = 0; i < pref.length; i++) if (ids.indexOf(pref[i]) >= 0) return pref[i];
    ids = ids.filter(function (x) { return which === 'xai' ? /grok/.test(x) && !/image|imagine|video/.test(x) : !/whisper|tts|guard|embed|orpheus/.test(x); });
    return ids[0] || null;
  }
  async function callOpenAI(c, which, prompt, o, retried) {
    var content = prompt, imgs = o.images || [];
    if (imgs.length && which === 'xai') {
      content = [];
      for (var i = 0; i < imgs.length; i++) content.push({ type: 'image_url', image_url: { url: 'data:' + (imgs[i].type || 'image/png') + ';base64,' + await fileToB64(imgs[i]) } });
      content.push({ type: 'text', text: prompt });
    }
    var model = c[which + '_model'], name = which === 'groq' ? 'Groq' : 'Grok (xAI)';
    var r;
    try {
      r = await fetch(BASE[which] + '/chat/completions', {
        method: 'POST', signal: o.signal,
        headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + c[which + '_key'].trim() },
        body: JSON.stringify({ model: model, max_tokens: 4096, messages: [{ role: 'user', content: content }] })
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw e;
      throw err('Could not reach ' + name + '. Check your internet. If it still fails, your browser is blocking direct calls (CORS): use the Python version of the app (start.bat) or choose Ollama.');
    }
    var j = await readJSON(r);
    if (!r.ok) {
      var m = (j.error && (j.error.message || j.error)) || ('HTTP ' + r.status);
      if ((r.status === 404 || (r.status === 400 && /model/i.test(String(m)))) && !retried) {
        var alt = await openaiPickModel(c, which, o.signal);
        if (alt && alt !== model) { c[which + '_model'] = alt; cfg[which + '_model'] = alt; save(cfg); return callOpenAI(c, which, prompt, o, true); }
      }
      if (r.status === 401) throw err('Your ' + name + ' key was rejected. Open AI Setup and paste it again' + (which === 'groq' ? ' (Groq keys start with gsk_).' : ' (xAI keys start with xai-).'));
      if (r.status === 402 || (r.status === 403 && which === 'xai')) throw err('xAI says this key has no credit. Grok is paid, so add credit at console.x.ai, or switch to Groq (free) in AI Setup.');
      if (r.status === 429) throw err(name + ' says too many requests or the free limit is used up. Wait a minute and try again.', 'rate_limited');
      if (r.status === 413) throw err('That was too much text for ' + name + ' free limits. Try shorter input.');
      throw err(name + ' error: ' + m);
    }
    var ch = (j.choices || [])[0] || {};
    return { text: (ch.message && ch.message.content) || '', truncated: ch.finish_reason === 'length' };
  }

  async function callOllama(c, prompt, o) {
    var r;
    try {
      r = await fetch(c.ollama_url.replace(/\/$/, '') + '/api/chat', {
        method: 'POST', signal: o.signal, headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ model: c.ollama_model, stream: false, messages: [{ role: 'user', content: prompt }] })
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw e;
      throw err('Cannot reach Ollama. Make sure Ollama is running, and that you started it with the setting OLLAMA_ORIGINS=* (see AI Setup for the one-line command). Easier: use a free Gemini key instead.');
    }
    var j = await readJSON(r);
    if (!r.ok) {
      if (r.status === 404) throw err('Ollama does not have the model "' + c.ollama_model + '". Run:  ollama pull ' + c.ollama_model);
      if (r.status === 403) throw err('Ollama blocked this page. Restart Ollama with OLLAMA_ORIGINS=* (see AI Setup).');
      throw err('Ollama error: ' + ((j && j.error) || r.status));
    }
    return { text: (j.message && j.message.content) || '', truncated: false };
  }

  async function run(prompt, o) {
    o = o || {};
    var c = cfg, res;
    if (c.provider === 'groq' || c.provider === 'xai') res = await callOpenAI(Object.assign({}, c), c.provider, prompt, o);
    else if (c.provider === 'gemini') res = await callGemini(Object.assign({}, c), prompt, o);
    else if (c.provider === 'anthropic') res = await callAnthropic(c, prompt, o);
    else res = await callOllama(c, prompt, o);
    if (o.onText) { try { o.onText({ text: res.text }); } catch (e) {} }
    return res;
  }

  function extractJSON(t) {
    t = String(t || '').replace(/```json|```/g, '').trim();
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
  }

  function makeSample() {
    var f = function (prompt, o) { return run(prompt, o); };
    f.json = async function (prompt, o) {
      var r = await run(prompt, o), obj = extractJSON(r.text);
      if (!obj) { r = await run(prompt + '\n\nReply with ONLY the JSON object. No markdown fences, no commentary.', o); obj = extractJSON(r.text); }
      if (!obj) throw { code: 'invalid_json', message: 'The AI reply could not be read as data.' };
      return obj;
    };
    f.limits = async function () {
      if (cfg.provider === 'ollama' || cfg.provider === 'groq') return {};
      return { images: { maxCount: 4, mediaTypes: ['image/png', 'image/jpeg', 'image/webp', 'image/gif'], maxInputBytes: 4000000 } };
    };
    return f;
  }

  var downloads = {
    save: async function (o) {
      var b = new Blob([o.data], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = o.filename || 'export.txt';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }
  };

  window.claude = {
    isShim: true,
    use: async function (name) {
      if (name === 'sample') return configured(cfg) ? makeSample() : null;
      if (name === 'downloads') return downloads;
      return null;
    }
  };

  /* ---------- AI Setup button + panel ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ui() {
    var css = document.createElement('style');
    css.textContent =
      '#aisBtn{position:fixed;right:14px;bottom:14px;z-index:2147483000;border:0;border-radius:999px;padding:10px 16px;font:600 14px system-ui,sans-serif;color:#fff;background:#4f46e5;box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:pointer}' +
      '#aisBtn.ok{background:#059669}' +
      '#aisBox{position:fixed;inset:0;z-index:2147483001;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px}' +
      '#aisBox.on{display:flex}' +
      '#aisCard{background:#fff;color:#111;width:100%;max-width:470px;max-height:92vh;overflow:auto;border-radius:14px;padding:18px;font:14px/1.45 system-ui,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.4)}' +
      '#aisCard h3{margin:0 0 4px;font-size:18px}#aisCard p{margin:6px 0}#aisCard label{display:block;margin:10px 0 3px;font-weight:600}' +
      '#aisCard input,#aisCard select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:8px;font:14px system-ui,sans-serif;background:#fff;color:#111}' +
      '#aisCard .row{display:flex;gap:8px;margin-top:14px}#aisCard button{flex:1;padding:10px;border:0;border-radius:8px;font:600 14px system-ui,sans-serif;cursor:pointer}' +
      '#aisCard .pri{background:#4f46e5;color:#fff}#aisCard .sec{background:#e5e7eb;color:#111}' +
      '#aisCard .hint{font-size:12.5px;color:#444;background:#f3f4f6;border-radius:8px;padding:8px;margin-top:6px}' +
      '#aisCard code{background:#e5e7eb;padding:1px 4px;border-radius:4px;font-size:12.5px;word-break:break-all}' +
      '#aisMsg{margin-top:8px;font-weight:600}';
    document.head.appendChild(css);
    var btn = document.createElement('button'); btn.id = 'aisBtn'; btn.type = 'button';
    var box = document.createElement('div'); box.id = 'aisBox';
    document.body.appendChild(btn); document.body.appendChild(box);

    function label() {
      var ok = configured(cfg);
      btn.className = ok ? 'ok' : '';
      btn.textContent = ok ? 'AI: ' + ({ groq: 'Groq', xai: 'Grok', gemini: 'Gemini', anthropic: 'Claude', ollama: 'Ollama' })[cfg.provider] + ' \u2713' : '\u2699 AI Setup (tap to turn on AI)';
    }
    function fields() {
      var p = document.getElementById('aisProv').value, h = '';
      if (p === 'groq') h = '<label>Groq key (free)</label><input id="aisQK" type="password" autocomplete="off" placeholder="gsk_..." value="' + esc(cfg.groq_key) + '">' +
        '<div class="hint"><b>Free, no card:</b> open <code>console.groq.com/keys</code>, sign in, tap <b>Create API Key</b>, copy it, paste above.</div>' +
        '<label>Model (leave as is)</label><input id="aisQM" value="' + esc(cfg.groq_model) + '">';
      else if (p === 'xai') h = '<label>Grok (xAI) key</label><input id="aisXK" type="password" autocomplete="off" placeholder="xai-..." value="' + esc(cfg.xai_key) + '">' +
        '<div class="hint">Get it at <code>console.x.ai</code>. The Grok API is <b>paid</b> (needs credit). For a free option choose Groq above.</div>' +
        '<label>Model (leave as is)</label><input id="aisXM" value="' + esc(cfg.xai_model) + '">';
      else h = '<label>Ollama address</label><input id="aisOU" value="' + esc(cfg.ollama_url) + '"><label>Model</label><input id="aisOM" value="' + esc(cfg.ollama_model) + '">' +
        '<div class="hint">No key needed. Ollama must be running and allowed to talk to web pages. Windows (PowerShell): <code>setx OLLAMA_ORIGINS "*"</code> then restart Ollama. Mac/Linux: <code>OLLAMA_ORIGINS=* ollama serve</code>. Then run <code>ollama pull llama3.2</code> once.</div>';
      document.getElementById('aisF').innerHTML = h;
    }
    function open() {
      box.innerHTML = '<div id="aisCard"><h3>AI Setup</h3><p>Pick where the AI answers come from. Everything is saved only in this browser.</p>' +
        '<label>AI provider</label><select id="aisProv"><option value="groq">Groq - free key (recommended)</option><option value="xai">Grok (xAI) - paid key</option><option value="ollama">Ollama - no key, runs on this computer</option></select>' +
        '<div id="aisF"></div><div id="aisMsg"></div>' +
        '<div class="row"><button class="sec" id="aisX" type="button">Close</button><button class="sec" id="aisT" type="button">Test</button><button class="pri" id="aisS" type="button">Save</button></div></div>';
      box.className = 'on';
      var sel = document.getElementById('aisProv'); if (['groq','xai','ollama'].indexOf(cfg.provider) < 0) cfg.provider = 'groq'; sel.value = cfg.provider; fields();
      sel.onchange = function () { cfg.provider = sel.value; fields(); };
      function read() {
        var n = Object.assign({}, cfg); n.provider = sel.value;
        var g = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : null; };
        if (g('aisQK') !== null) n.groq_key = g('aisQK'); if (g('aisQM')) n.groq_model = g('aisQM');
        if (g('aisXK') !== null) n.xai_key = g('aisXK'); if (g('aisXM')) n.xai_model = g('aisXM');
        if (g('aisOU')) n.ollama_url = g('aisOU'); if (g('aisOM')) n.ollama_model = g('aisOM');
        return n;
      }
      document.getElementById('aisX').onclick = function () { box.className = ''; };
      document.getElementById('aisS').onclick = function () { cfg = read(); save(cfg); location.reload(); };
      document.getElementById('aisT').onclick = async function () {
        var m = document.getElementById('aisMsg'); var keep = cfg; cfg = read();
        m.style.color = '#444'; m.textContent = 'Testing...';
        try { var r = await run('Reply with exactly: AI connection OK', { modelTier: 'quick' }); m.style.color = '#059669'; m.textContent = 'Works: ' + String(r.text).slice(0, 60); }
        catch (e) { m.style.color = '#b91c1c'; m.textContent = (e && e.message) || 'Test failed.'; }
        cfg = keep;
      };
    }
    btn.onclick = open; label();
    if (!configured(cfg)) { try { if (!sessionStorage.getItem('ais_shown')) { sessionStorage.setItem('ais_shown', '1'); setTimeout(open, 600); } } catch (e) {} }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ui); else ui();
})();

</script>

<meta charset="utf-8">
<title>RepoSage</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1FA;--surface:#FFFFFF;--surface2:#EAE7F6;--ink:#171433;--muted:#625D88;--line:#D9D4EE;
  --accent:#5B3DF5;--accent-ink:#FFFFFF;--coral:#E8523A;--mint:#0E9F7B;--amber:#B98100;
  --code-bg:#1B1740;--code-ink:#E9E6FF;--shadow:rgba(40,28,120,.16);
  --sans:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100E24;--surface:#1A1738;--surface2:#262150;--ink:#F1EEFF;--muted:#A8A3D2;--line:#322D62;
  --accent:#9A86FF;--accent-ink:#120E33;--coral:#FF8A70;--mint:#3DDBB0;--amber:#FFCB47;
  --code-bg:#0B0919;--code-ink:#E9E6FF;--shadow:rgba(0,0,0,.5);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#100E24;--surface:#1A1738;--surface2:#262150;--ink:#F1EEFF;--muted:#A8A3D2;--line:#322D62;
  --accent:#9A86FF;--accent-ink:#120E33;--coral:#FF8A70;--mint:#3DDBB0;--amber:#FFCB47;
  --code-bg:#0B0919;--code-ink:#E9E6FF;--shadow:rgba(0,0,0,.5);color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}
#top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;position:relative}
#top::before{content:"";position:absolute;inset:-30px 0 auto 0;height:120px;background:radial-gradient(60% 100% at 18% 0%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 70%);pointer-events:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.01em;position:relative}
.orb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0,#C7B8FF 18%,var(--accent) 55%,#2B1A9E 100%);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent),0 0 18px color-mix(in srgb,var(--accent) 60%,transparent)}
#hdr-right{display:flex;align-items:center;gap:8px;position:relative;min-width:0}

# TaskHub API

A small REST API for personal task management. Users register, log in with a password and receive a signed bearer token, then create and manage their own tasks.

## Architecture

The project follows a layered design:

- **Routes** (`src/routes`) parse HTTP requests and call services. `auth.js` handles registration and login, `tasks.js` exposes task CRUD.
- **Services** (`src/services`) hold business rules. `taskService.js` enforces task ownership, filtering and pagination. `tokenService.js` signs and verifies tokens.
- **Middleware** (`src/middleware`) covers cross-cutting concerns: bearer authentication, an in-memory rate limiter and the central error handler.
- **Store** (`src/db/store.js`) is an in-memory database that snapshots itself to a JSON file on a timer.
- **Utils** (`src/utils`) provide validation, logging and the `AppError` class.

Request flow: `server.js` -> rate limiter -> route -> `requireAuth` -> service -> store -> JSON response. Any thrown `AppError` is turned into a JSON error by the error handler.

## Running

```
npm install
JWT_SECRET=change-me npm start
npm test
```

## Environment variables

| Name | Default | Purpose |
| --- | --- | --- |
| PORT | 3000 | HTTP port |
| JWT_SECRET | dev-secret-change-me | Signing key for tokens |
| TOKEN_TTL | 28800 | Token lifetime in seconds |
| AUTOSAVE_MS | 15000 | How often the store writes its snapshot |
| RATE_LIMIT_MAX | 100 | Requests per minute per IP |

## Endpoints

- `POST /auth/register` and `POST /auth/login`
- `GET /tasks`, `POST /tasks`, `GET /tasks/:id`, `PATCH /tasks/:id`, `POST /tasks/:id/complete`, `DELETE /tasks/:id`
- `GET /health`

<script type="text/plain" class="demo" data-path="src/db/store.js">
// In-memory store with two collections (users, tasks). A snapshot is written to disk on a timer.
const fs = require('fs/promises');
const path = require('path');
const crypto = require('crypto');
const config = require('../config');
const logger = require('../utils/logger');

let dirty = false;
let timer = null;

class Collection {
  constructor(name) {
    this.name = name;
    this.rows = new Map();
  }
  insert(data) {
    const row = { id: crypto.randomUUID(), createdAt: new Date().toISOString(), ...data };
    this.rows.set(row.id, row);
    dirty = true;
    return row;
  }
  find(predicate) {
    return [...this.rows.values()].filter(predicate);
  }
  findOne(predicate) {
    return this.find(predicate)[0] || null;
  }
  update(id, patch) {
    const row = this.rows.get(id);
    if (!row) return null;
    Object.assign(row, patch, { updatedAt: new Date().toISOString() });
    dirty = true;
    return row;
  }
  remove(id) {
    dirty = this.rows.delete(id) || dirty;
  }
}

const users = new Collection('users');
const tasks = new Collection('tasks');

async function load() {
  try {
    const raw = await fs.readFile(config.dataFile, 'utf8');
    const snapshot = JSON.parse(raw);
    for (const u of snapshot.users || []) users.rows.set(u.id, u);
    for (const t of snapshot.tasks || []) tasks.rows.set(t.id, t);
    logger.info('Loaded ' + users.rows.size + ' users and ' + tasks.rows.size + ' tasks');
  } catch (err) {
    if (err.code !== 'ENOENT') throw err;
  }
}

async function save() {
  if (!dirty) return;
  const snapshot = { users: [...users.rows.values()], tasks: [...tasks.rows.values()] };
  await fs.mkdir(path.dirname(config.dataFile), { recursive: true });
  await fs.writeFile(config.dataFile, JSON.stringify(snapshot, null, 2));
  dirty = false;
}

function startAutosave(intervalMs) {
  if (timer) clearInterval(timer);
  timer = setInterval(() => save().catch((e) => logger.error('Autosave failed: ' + e.message)), intervalMs);
  timer.unref();
}

module.exports = { users, tasks, load, save, startAutosave };
</script>
<script type="text/plain" class="demo" data-path="src/middleware/auth.js">
// Authentication middleware: reads the Bearer token, verifies it and attaches req.user.
const tokenService = require('../services/tokenService');
const { AppError } = require('../utils/errors');

function requireAuth(req, res, next) {
  const header = req.headers.authorization || '';
  const [scheme, token] = header.split(' ');
  if (scheme !== 'Bearer' || !token) {
    return next(new AppError(401, 'Missing bearer token'));
  }
  try {
    const payload = tokenService.verifyToken(token);
    req.user = { id: payload.sub, role: payload.role };
    next();
  } catch (err) {
    next(new AppError(401, 'Invalid or expired token'));
  }
}

function requireRole(role) {
  return (req, res, next) => {
    if (!req.user || req.user.role !== role) {
      return next(new AppError(403, 'Requires role ' + role));
    }
    next();
  };
}

module.exports = { requireAuth, requireRole };
</script>

// Converts thrown errors into consistent JSON responses.
const logger = require('../utils/logger');
const { AppError } = require('../utils/errors');

module.exports = function errorHandler(err, req, res, next) {
  if (err instanceof AppError) {
    return res.status(err.status).json({ error: err.message, details: err.details || null });
  }
  logger.error('Unhandled error: ' + (err && err.stack));
  res.status(500).json({ error: 'Internal server error' });
};

<script type="text/plain" class="demo" data-path="src/middleware/rateLimit.js">
// In-memory sliding-window rate limiter keyed by client IP.
const { AppError } = require('../utils/errors');

function rateLimit(options) {
  const hits = new Map();
  return function limiter(req, res, next) {
    const key = req.ip || 'unknown';
    const now = Date.now();
    const recent = (hits.get(key) || []).filter((t) => now - t < options.windowMs);
    if (recent.length >= options.max) {
      res.set('Retry-After', String(Math.ceil(options.windowMs / 1000)));
      return next(new AppError(429, 'Too many requests'));
    }
    recent.push(now);
    hits.set(key, recent);
    next();
  };
}

module.exports = rateLimit;
</script>
<script type="text/plain" class="demo" data-path="src/routes/auth.js">
// Registration and login. Passwords are hashed with scrypt and a per-user random salt.
const crypto = require('crypto');
const express = require('express');
const store = require('../db/store');
const tokenService = require('../services/tokenService');
const { AppError } = require('../utils/errors');
const { validateEmail, requireString } = require('../utils/validate');

const router = express.Router();

function hashPassword(password, salt = crypto.randomBytes(16).toString('hex')) {
  const hash = crypto.scryptSync(password, salt, 64).toString('hex');
  return salt + ':' + hash;
}

function verifyPassword(password, stored) {
  const [salt, hash] = stored.split(':');
  const candidate = crypto.scryptSync(password, salt, 64);
  return crypto.timingSafeEqual(candidate, Buffer.from(hash, 'hex'));
}

router.post('/register', (req, res, next) => {
  try {
    const email = validateEmail(req.body.email);
    const password = requireString(req.body.password, 'password', { min: 8, max: 128 });
    if (store.users.findOne((u) => u.email === email)) {
      throw new AppError(409, 'Email already registered');
    }
    const user = store.users.insert({ email, passwordHash: hashPassword(password), role: 'member' });
    res.status(201).json({ id: user.id, email: user.email });
  } catch (err) {
    next(err);
  }
});

router.post('/login', (req, res, next) => {
  try {
    const email = validateEmail(req.body.email);
    const user = store.users.findOne((u) => u.email === email);
    if (!user || !verifyPassword(String(req.body.password || ''), user.passwordHash)) {
      throw new AppError(401, 'Wrong email or password');
    }
    const token = tokenService.signToken({ sub: user.id, role: user.role });
    res.json({ token, expiresIn: tokenService.ttlSeconds() });
  } catch (err) {
    next(err);
  }
});

module.exports = router;
</script>

<script type="text/plain" class="demo" data-path="src/server.js">
// TaskHub API entry point: wires middleware, routes and the error handler.
const express = require('express');
const config = require('./config');
const logger = require('./utils/logger');
const store = require('./db/store');
const rateLimit = require('./middleware/rateLimit');
const errorHandler = require('./middleware/errorHandler');
const authRoutes = require('./routes/auth');
const taskRoutes = require('./routes/tasks');

const app = express();
app.use(express.json({ limit: '100kb' }));
app.use(rateLimit({ windowMs: config.rateLimit.windowMs, max: config.rateLimit.max }));
app.use((req, res, next) => {
  logger.info(req.method + ' ' + req.url);
  next();
});

app.get('/health', (req, res) => res.json({ ok: true, uptime: process.uptime() }));
app.use('/auth', authRoutes);
app.use('/tasks', taskRoutes);
app.use(errorHandler);

async function start() {
  await store.load();
  store.startAutosave(config.autosaveMs);
  app.listen(config.port, () => logger.info('TaskHub listening on ' + config.port));
}

if (require.main === module) start();
module.exports = { app, start };
</script>
<script type="text/plain" class="demo" data-path="src/services/taskService.js">
// Task business rules: ownership checks, filtering and pagination live here, not in the routes.
const store = require('../db/store');
const config = require('../config');
const { AppError } = require('../utils/errors');

function loadOwnedTask(user, id) {
  const task = store.tasks.findOne((t) => t.id === id);
  if (!task) throw new AppError(404, 'Task not found');
  if (task.ownerId !== user.id && user.role !== 'admin') {
    throw new AppError(403, 'You do not own this task');
  }
  return task;
}

function createTask(user, input) {
  return store.tasks.insert({
    ownerId: user.id,
    title: input.title,
    notes: input.notes || '',
    priority: input.priority || 'medium',
    dueDate: input.dueDate || null,
    status: 'open',
    completedAt: null,
  });
}

function listTasks(user, query) {
  const size = Math.min(Number(query.pageSize) || config.pageSize.default, config.pageSize.max);
  const page = Math.max(Number(query.page) || 1, 1);
  let items = store.tasks.find((t) => t.ownerId === user.id);
  if (query.status) items = items.filter((t) => t.status === query.status);
  if (query.priority) items = items.filter((t) => t.priority === query.priority);
  if (query.dueBefore) items = items.filter((t) => t.dueDate && t.dueDate < query.dueBefore);
  items.sort((a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));
  const total = items.length;
  return { total, page, pageSize: size, items: items.slice((page - 1) * size, page * size) };
}

function getTask(user, id) {
  return loadOwnedTask(user, id);
}

function updateTask(user, id, input) {
  const task = loadOwnedTask(user, id);
  return store.tasks.update(task.id, input);
}

function completeTask(user, id) {
  const task = loadOwnedTask(user, id);
  if (task.status === 'done') throw new AppError(409, 'Task already completed');
  return store.tasks.update(task.id, { status: 'done', completedAt: new Date().toISOString() });
}

function deleteTask(user, id) {
  const task = loadOwnedTask(user, id);
  store.tasks.remove(task.id);
}

module.exports = { createTask, listTasks, getTask, updateTask, completeTask, deleteTask };
</script>
<script type="text/plain" class="demo" data-path="src/services/tokenService.js">
// Minimal signed tokens (header.payload.signature) using HMAC-SHA256, no external library.
const crypto = require('crypto');
const config = require('../config');

function b64url(input) {
  return Buffer.from(input).toString('base64url');
}

function sign(data) {
  return crypto.createHmac('sha256', config.jwtSecret).update(data).digest('base64url');
}

function ttlSeconds() {
  return config.tokenTtlSeconds;
}

function signToken(claims) {
  const header = b64url(JSON.stringify({ alg: 'HS256', typ: 'JWT' }));
  const exp = Math.floor(Date.now() / 1000) + config.tokenTtlSeconds;
  const payload = b64url(JSON.stringify({ ...claims, exp }));
  return header + '.' + payload + '.' + sign(header + '.' + payload);
}

function verifyToken(token) {
  const parts = String(token).split('.');
  if (parts.length !== 3) throw new Error('Malformed token');
  const expected = sign(parts[0] + '.' + parts[1]);
  const a = Buffer.from(parts[2]);
  const b = Buffer.from(expected);
  if (a.length !== b.length || !crypto.timingSafeEqual(a, b)) {
    throw new Error('Bad signature');
  }
  const payload = JSON.parse(Buffer.from(parts[1], 'base64url').toString());
  if (payload.exp < Math.floor(Date.now() / 1000)) throw new Error('Token expired');
  return payload;
}

module.exports = { signToken, verifyToken, ttlSeconds };
</script>

<script type="text/plain" class="demo" data-path="src/utils/validate.js">
// Request validators. Each returns the cleaned value or throws a 400 AppError.
const { AppError } = require('./errors');

const PRIORITIES = ['low', 'medium', 'high'];
const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function requireString(value, field, { min = 1, max = 200 } = {}) {
  if (typeof value !== 'string') throw new AppError(400, field + ' must be a string');
  const trimmed = value.trim();
  if (trimmed.length < min || trimmed.length > max) {
    throw new AppError(400, field + ' must be between ' + min + ' and ' + max + ' characters');
  }
  return trimmed;
}

function validateEmail(value) {
  const email = requireString(value, 'email', { max: 254 }).toLowerCase();
  if (!EMAIL_PATTERN.test(email)) throw new AppError(400, 'email is not valid');
  return email;
}

function validatePriority(value) {
  if (!PRIORITIES.includes(value)) {
    throw new AppError(400, 'priority must be one of ' + PRIORITIES.join(', '));
  }
  return value;
}

function validateDueDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value)) || Number.isNaN(Date.parse(value))) {
    throw new AppError(400, 'dueDate must look like YYYY-MM-DD');
  }
  return value;
}

function validateTaskInput(body, { partial = false } = {}) {
  const input = {};
  if (!partial || body.title !== undefined) input.title = requireString(body.title, 'title');
  if (body.notes !== undefined) input.notes = requireString(body.notes, 'notes', { min: 0, max: 2000 });
  if (body.priority !== undefined) input.priority = validatePriority(body.priority);
  if (body.dueDate !== undefined) input.dueDate = validateDueDate(body.dueDate);
  return input;
}

module.exports = { requireString, validateEmail, validatePriority, validateDueDate, validateTaskInput };
</script>
<script type="text/plain" class="demo" data-path="tests/tasks.test.js">
// Tests for the task service: creation defaults, ownership enforcement and pagination limits.
const test = require('node:test');
const assert = require('node:assert');
const taskService = require('../src/services/taskService');
const { validateTaskInput } = require('../src/utils/validate');

const alice = { id: 'user-alice', role: 'member' };
const bob = { id: 'user-bob', role: 'member' };

test('createTask applies defaults', () => {
  const task = taskService.createTask(alice, validateTaskInput({ title: 'Write docs' }));
  assert.strictEqual(task.priority, 'medium');
  assert.strictEqual(task.status, 'open');
});

test('another user cannot read a task they do not own', () => {
  const task = taskService.createTask(alice, { title: 'Private' });
  assert.throws(() => taskService.getTask(bob, task.id), /do not own/);
});

test('completing a task twice returns a conflict', () => {
  const task = taskService.createTask(alice, { title: 'Ship it' });
  taskService.completeTask(alice, task.id);
  assert.throws(() => taskService.completeTask(alice, task.id), /already completed/);
});

test('pageSize is capped at the configured maximum', () => {
  const result = taskService.listTasks(alice, { pageSize: '5000' });
  assert.ok(result.pageSize <= 100);
});

test('invalid priority is rejected by the validator', () => {
  assert.throws(() => validateTaskInput({ title: 'x', priority: 'urgent' }), /priority must be/);
});
</script>

document.addEventListener('click', function (ev) {
